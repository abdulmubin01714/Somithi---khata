<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>সমিতি খাতা</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#EFE7D8" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="icon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Hind Siliguri', sans-serif;
  background: #EFE7D8;
  background-image: repeating-linear-gradient(#EFE7D8 0 39px, #D9CDAF 39px 40px);
  min-height: 100vh;
  color: #1E2A38;
}
#app {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  padding-left: 34px; position: relative; border-left: 3px solid #A13D3D;
  background: #EFE7D8; background-image: repeating-linear-gradient(#EFE7D8 0 39px, #D9CDAF 39px 40px);
  padding-bottom: 30px;
}
button, input, textarea { font-family: inherit; }

.loadingWrap { padding: 80px 24px; text-align: center; color: #6b5f45; }

.errBanner { background: #A13D3D; color: #fff; padding: 8px 14px; font-size: 13px; text-align: center; }

/* ---- Gate / Cover ---- */
.gate { padding-bottom: 40px; }
.cover { padding: 34px 20px 26px; text-align: center; position: relative; }
.coverRule { width: 46px; height: 3px; background: #B8892B; margin: 0 auto 14px; border-radius: 2px; }
.coverTitle { font-family: 'Tiro Bangla', serif; font-size: 30px; margin: 0 0 6px; letter-spacing: 0.3px; }
.coverSub { margin: 0 0 18px; color: #6b5f45; font-size: 14px; }
.versionTag { margin: -12px 0 18px; color: #B8892B; font-size: 10.5px; font-weight: 600; }
.syncBadge { margin-top: 12px; font-size: 11.5px; color: #6b5f45; }
.roomBadge { margin-top: 4px; font-size: 11.5px; color: #6b5f45; }
.linkBtn { background: none; border: none; color: #2F5233; text-decoration: underline; font-family: inherit; font-size: 11.5px; cursor: pointer; padding: 0; }

.stamp {
  display: inline-flex; align-items: center; justify-content: center;
  width: 128px; height: 128px; border-radius: 50%; border: 3px double #2F5233;
  color: #2F5233; transform: rotate(-7deg); margin: 6px auto 0;
}
.stamp.small { width: 96px; height: 96px; }
.stamp.gold { border-color: #B8892B; color: #B8892B; transform: rotate(6deg); }
.stampRow { display: flex; justify-content: center; align-items: center; gap: 4px; }
.stampRow .stamp { width: 108px; height: 108px; }
.stampRow .stampInner strong { font-size: 15px; }
.stampInner { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; }
.stampInner strong { font-family: 'Tiro Bangla', serif; font-size: 19px; }
.stampBar { display: flex; justify-content: center; padding: 14px 0 6px; }

.gateBody { padding: 8px 20px 20px; }
.sectionLabel { font-family: 'Tiro Bangla', serif; font-size: 15px; font-weight: 400; color: #4a4030; margin: 18px 0 10px; }

.bigChoice {
  width: 100%; display: flex; align-items: center; gap: 12px; background: #fff;
  border: 1px solid #D9CDAF; border-left: 4px solid #2F5233; border-radius: 6px;
  padding: 14px; text-align: left; cursor: pointer; font-family: inherit; margin-top: 8px;
}
.bigChoiceIcon {
  width: 36px; height: 36px; border-radius: 50%; background: #EFE7D8;
  display: flex; align-items: center; justify-content: center; color: #2F5233; flex-shrink: 0; font-size: 17px;
}
.bigChoiceIcon.view { color: #B8892B; }
.viewChoice { border-left-color: #B8892B; }
.bigChoiceIcon.wa { color: #25693B; }
.waChoice { border-left-color: #25693B; }
.bigChoice strong { display: block; font-size: 15px; }
.bigChoice small { display: block; color: #6b5f45; font-size: 12px; margin-top: 2px; }
.bigChoice .chev { margin-left: auto; color: #a89a79; flex-shrink: 0; }

.divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; color: #a89a79; font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #D9CDAF; }

.searchRow {
  display: flex; align-items: center; gap: 8px; background: #fff;
  border: 1px solid #D9CDAF; border-radius: 6px; padding: 10px 12px; color: #a89a79;
}
.searchRow input { border: none; outline: none; flex: 1; font-family: inherit; font-size: 14px; color: #1E2A38; background: transparent; }

.memberPickList { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.memberPick, a.memberPick {
  display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #D9CDAF;
  border-radius: 6px; padding: 10px 12px; cursor: pointer; font-family: inherit; text-decoration: none; color: inherit;
  width: 100%; text-align: left;
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: #B8892B; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.avatar.wa { background: #25693B; }
.memberPickName { font-size: 14px; text-align: left; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.waNum { color: #8a7d5f; font-size: 12px; }
.chev { color: #a89a79; }

.empty { color: #8a7d5f; font-size: 13px; padding: 10px 2px; }

/* ---- Notice board ---- */
.noticeBoard { padding: 4px 20px 6px; }
.boardTitle { display: flex; align-items: center; gap: 6px; font-family: 'Tiro Bangla', serif; font-size: 15px; font-weight: 400; color: #4a4030; margin: 10px 0 10px; }
.boardEmpty { margin: 0; }
.pinGrid { display: flex; flex-direction: column; gap: 10px; }
.pinNote { position: relative; background: #FBF3D9; border: 1px solid #E4D9B4; border-radius: 3px; padding: 12px 12px 10px; box-shadow: 2px 3px 6px rgba(0,0,0,0.08); }
.pinNote.tone1 { background: #E9F0E3; border-color: #CFDCC3; }
.pinNote.tone2 { background: #F3E3DE; border-color: #E0C7BE; }
.pinNote:nth-child(odd) { transform: rotate(-1deg); }
.pinNote:nth-child(even) { transform: rotate(1deg); }
.pinIconMark { position: absolute; top: -9px; left: 14px; color: #A13D3D; font-size: 15px; transform: rotate(-25deg); }
.pinNote strong { display: block; font-size: 13.5px; margin-bottom: 3px; }
.pinNote p { margin: 0; font-size: 13px; line-height: 1.5; color: #3a3222; white-space: pre-wrap; }
.pinNote small { display: block; margin-top: 6px; color: #8a7d5f; font-size: 11px; }

.printLink {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  background: transparent; border: none; color: #6b5f45; font-family: inherit; font-size: 12.5px;
  cursor: pointer; margin-top: 18px; padding: 8px; text-decoration: underline;
}

/* ---- Views / Topbar ---- */
.view { padding-bottom: 30px; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; position: sticky; top: 0; background: #EFE7D8; z-index: 5; }
.topbar h1 { font-family: 'Tiro Bangla', serif; font-size: 19px; margin: 0; flex: 1; }
.backBtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #D9CDAF; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.saveDot { width: 8px; height: 8px; border-radius: 50%; background: #C9BBA0; }
.saveDot.on { background: #B8892B; }

.tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
.tab { flex: 1; padding: 9px 2px; border: 1px solid #D9CDAF; background: #fff; border-radius: 6px 6px 0 0; font-family: inherit; font-size: 11.5px; cursor: pointer; color: #6b5f45; border-bottom: none; }
.tab.active { background: #fff; color: #1E2A38; font-weight: 600; border-bottom: 2px solid #2F5233; }

.panel { padding: 14px 20px 0; }

.addBtn {
  display: flex; align-items: center; gap: 6px; justify-content: center; width: 100%;
  background: #2F5233; color: #fff; border: none; border-radius: 6px; padding: 11px; font-family: inherit;
  font-size: 14px; cursor: pointer; margin-bottom: 14px;
}
.addBtn.allBtn { background: #B8892B; }

.ledgerCards { display: flex; flex-direction: column; gap: 10px; }
.ledgerCard { background: #fff; border: 1px solid #D9CDAF; border-radius: 6px; padding: 12px; }
.ledgerCardTop { display: flex; align-items: flex-start; gap: 10px; }
.serial { font-family: 'Tiro Bangla', serif; color: #B8892B; font-size: 13px; margin-top: 2px; }
.ledgerCardName { flex: 1; }
.ledgerCardName strong { display: block; font-size: 14.5px; }
.ledgerCardName small { display: flex; align-items: center; gap: 4px; color: #8a7d5f; font-size: 12px; margin-top: 2px; }
.ledgerCardBottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #D9CDAF; font-size: 12.5px; }
.ledgerCardBottom.solo { justify-content: flex-start; }
.noticeText { margin: 8px 0 0; font-size: 13px; color: #3a3222; line-height: 1.5; white-space: pre-wrap; }
.chipBtn {
  display: flex; align-items: center; gap: 4px; background: #EFE7D8; border: 1px solid #D9CDAF;
  border-radius: 20px; padding: 6px 11px; font-family: inherit; font-size: 12px; cursor: pointer; color: #2F5233;
  text-decoration: none;
}

.iconBtn { width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8a7d5f; flex-shrink: 0; font-size: 15px; }
.iconBtn.danger { color: #A13D3D; }

.entryList { display: flex; flex-direction: column; }
.entryRow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #D9CDAF; }
.entryDate { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #8a7d5f; width: 92px; flex-shrink: 0; }
.entryMid { flex: 1; min-width: 0; }
.entryMid strong { display: block; font-size: 13.5px; }
.entryMid small { color: #8a7d5f; font-size: 12px; }
.entryAmt { font-weight: 600; font-size: 14px; color: #2F5233; flex-shrink: 0; }

.viewOnlyNote { display: flex; align-items: center; gap: 6px; justify-content: center; color: #8a7d5f; font-size: 11.5px; padding: 6px 20px 0; }

/* ---- Modal ---- */
.modalOverlay { position: fixed; inset: 0; background: rgba(30,42,56,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.modalCard { background: #EFE7D8; width: 100%; max-width: 480px; border-radius: 14px 14px 0 0; padding: 18px 20px 26px; box-shadow: 0 -6px 24px rgba(0,0,0,0.2); }
.modalTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modalTop h3 { font-family: 'Tiro Bangla', serif; font-size: 16px; margin: 0; }

.fLabel { display: block; font-size: 12px; color: #6b5f45; margin: 12px 0 5px; }
.fInput { width: 100%; padding: 10px 12px; border: 1px solid #D9CDAF; border-radius: 6px; font-family: inherit; font-size: 14px; background: #fff; color: #1E2A38; }
.fTextarea { resize: vertical; line-height: 1.5; }
.fErr { color: #A13D3D; font-size: 12.5px; margin: 10px 2px 0; }
.modalHint { color: #6b5f45; font-size: 12.5px; line-height: 1.5; margin: 0 0 4px; }
.primaryBtn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: #2F5233; color: #fff; border: none; border-radius: 6px; padding: 12px; margin-top: 18px; font-family: inherit; font-size: 14px; cursor: pointer; }
.primaryBtn:disabled { opacity: 0.6; }

/* ---- Print / PDF export ---- */
.printReport { display: none; }
@media print {
  body * { visibility: hidden; }
  .printReport, .printReport * { visibility: visible; }
  .printReport { display: block !important; position: absolute; left: 0; top: 0; width: 100%; font-family: 'Hind Siliguri', sans-serif; color: #1E2A38; padding: 10px; }
  .printReport h1 { font-family: 'Tiro Bangla', serif; font-size: 22px; margin: 0 0 4px; }
  .printReport .printSub { margin: 0 0 4px; color: #444; font-size: 13px; }
  .printReport .printMeta { margin: 0 0 16px; font-size: 12px; color: #444; }
  .printReport h2 { font-family: 'Tiro Bangla', serif; font-size: 16px; margin: 22px 0 8px; border-bottom: 2px solid #1E2A38; padding-bottom: 4px; }
  .printReport table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .printReport th, .printReport td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
  .printReport th { background: #eee; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   সমিতি খাতা — standalone app with optional real-time sync
   via Firebase Firestore. If FIREBASE_CONFIG below is left
   as placeholder values, the app falls back to local-only
   storage (localStorage) on this device.
   ========================================================= */

/* ---------- 1) PASTE YOUR OWN FIREBASE CONFIG HERE ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKTdMFRQ_ZNwiN6TAl9KjJwM4wFVt9_8U",
  authDomain: "somithi-khatha1.firebaseapp.com",
  projectId: "somithi-khatha1",
  storageBucket: "somithi-khatha1.firebasestorage.app",
  messagingSenderId: "815660825212",
  appId: "1:815660825212:web:fd892b564c5b452ecb27f9"
};
/* -------------------------------------------------------------- */

const STORAGE_KEY = "somiti-data-v1";
const ROOM_KEY = "somiti-room-code-v1";
const DEFAULT_DATA = { somitiName: "আমাদের সমিতি", adminPinHash: null, members: [], entries: [], notices: [], whatsapp: [] };

/* ---------- helpers ---------- */
const bn = (n) => Number(n || 0).toLocaleString("bn-BD");
const taka = (n) => "৳" + bn(n);
const bnDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("bn-BD", { year: "numeric", month: "long", day: "numeric" });
};
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const waLink = (num) => {
  let d = String(num || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "88" + d.slice(1);
  return "https://wa.me/" + d;
};
async function hashPin(pin) {
  const enc = new TextEncoder().encode("somiti-salt::" + pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
/* localStorage can be blocked or throw in unusual contexts (e.g. a file
   opened directly from inside WhatsApp/another app via a content:// URI).
   These wrappers make sure such failures never silently stop the app -
   sync/PIN/etc still work for the current session even if nothing can
   be remembered for next time. */
const safeLS = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, val); } catch (e) {} },
  remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
};

/* ---------- Firebase setup ---------- */
const fbConfigured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes("আপনার");
let fbEnabled = false;
let db = null;
let fbDoc = null;
let fbUnsub = null;

if (fbConfigured && typeof firebase !== "undefined") {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    fbEnabled = true;
  } catch (e) { fbEnabled = false; }
}

let ROOM_CODE = safeLS.get(ROOM_KEY) || "";

/* ---------- state ---------- */
let DATA = loadLocal();
let UI = { role: null, pinGate: null, tab: "members", modal: null, query: "" };
let SYNC_STATUS = fbEnabled ? "connecting" : "local"; // connecting | live | local | error

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...DEFAULT_DATA, ...JSON.parse(raw) };
  } catch (e) {}
  return { ...DEFAULT_DATA };
}
function cacheLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch (e) {}
}

/* saveData: called after every local mutation of DATA.
   - always caches to localStorage (offline fallback)
   - if Firebase room is active, pushes the full doc so other
     devices in the same room receive it in real time */
function saveData() {
  cacheLocal();
  flashSaved();
  if (fbEnabled && ROOM_CODE && db) {
    db.collection("somiti-rooms").doc(ROOM_CODE).set(DATA).catch(() => {
      SYNC_STATUS = "error"; render();
    });
  }
}
let saveDotTimer = null;
function flashSaved() {
  const dot = document.querySelector(".saveDot");
  if (!dot) return;
  dot.classList.add("on");
  clearTimeout(saveDotTimer);
  saveDotTimer = setTimeout(() => dot.classList.remove("on"), 500);
}
function syncBadgeText() {
  const map = {
    live: "🟢 লাইভ সিঙ্ক চালু",
    connecting: "🟡 সংযোগ হচ্ছে…",
    local: "⚪ শুধু এই ডিভাইসে (অফলাইন মোড)",
    error: "🔴 সিঙ্ক সমস্যা — লোকাল মোডে চলছে",
  };
  return map[SYNC_STATUS] || "";
}

/* ---------- room (sync group) handling ---------- */
function startSync() {
  if (!fbEnabled) { SYNC_STATUS = "local"; render(); return; }
  if (!ROOM_CODE) { UI.modal = "roomGate"; render(); return; }
  connectRoom(ROOM_CODE);
}

function connectRoom(code) {
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  SYNC_STATUS = "connecting";
  render();
  fbDoc = db.collection("somiti-rooms").doc(code);
  fbUnsub = fbDoc.onSnapshot(
    (snap) => {
      SYNC_STATUS = "live";
      // Only load data if the document actually has something. We
      // deliberately never auto-write an empty document here - doing so
      // previously risked wiping real data if the existence check ever
      // misfired. A brand-new room simply starts empty locally and gets
      // created in Firestore the first time the user actually adds
      // something (via saveData()).
      const exists = typeof snap.exists === "function" ? snap.exists() : snap.exists;
      const remote = exists ? snap.data() : null;
      if (remote && (remote.members || remote.entries || remote.notices || remote.whatsapp)) {
        DATA = { ...DEFAULT_DATA, ...remote };
      } else if (!exists) {
        DATA = { ...DEFAULT_DATA };
      }
      // if exists but remote looks empty/malformed, keep current DATA
      // rather than blanking it out - safer default.
      cacheLocal();
      render();
    },
    () => { SYNC_STATUS = "error"; render(); }
  );
}

function setRoomCode(code) {
  ROOM_CODE = code.trim().toUpperCase();
  safeLS.set(ROOM_KEY, ROOM_CODE);
  UI.modal = null;
  connectRoom(ROOM_CODE);
}

function leaveRoom() {
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  safeLS.remove(ROOM_KEY);
  ROOM_CODE = "";
  UI.modal = "roomGate";
  render();
}

function totalFund() {
  return DATA.entries.reduce((s, e) => s + Number(e.amount), 0);
}
function memberTotal(id) {
  return DATA.entries.filter((e) => e.memberId === id).reduce((s, e) => s + Number(e.amount), 0);
}

/* ---------- render root ---------- */
function render() {
  const app = document.getElementById("app");
  let html = "";
  if (!UI.role) html += renderRoleGate();
  else if (UI.role === "admin") html += renderAdmin();
  else if (UI.role === "viewAll") html += renderPublicLedger();
  else if (UI.role === "whatsapp") html += renderWhatsAppView();
  else if (UI.role && UI.role.memberId) html += renderMemberView(UI.role.memberId);

  html += renderPrintReport();
  app.innerHTML = html;

  closeModalRoot();
  if (UI.modal) renderModal(UI.modal);

  bindEvents();
}

/* ---------- screens ---------- */
function renderRoleGate() {
  const q = UI.query.trim().toLowerCase();
  const members = DATA.members.filter((m) => m.name.toLowerCase().includes(q));
  const notices = [...DATA.notices].sort((a, b) => (a.date < b.date ? 1 : -1));

  return `
  <div class="gate">
    <div class="cover">
      <div class="coverRule"></div>
      <h1 class="coverTitle">${esc(DATA.somitiName)}</h1>
      <p class="coverSub">সদস্য চাঁদা ও জমার হিসাব খাতা</p>
      <p class="versionTag">সংস্করণ ৯ — যদি এই লেখাটা দেখতে পান, মানে আপনি সর্বশেষ ফাইলে আছেন ✓</p>
      <div class="stampRow">
        <div class="stamp"><span class="stampInner">মোট সদস্য<strong>${bn(DATA.members.length)}</strong></span></div>
        <div class="stamp gold"><span class="stampInner">মোট জমা<strong>${taka(totalFund())}</strong></span></div>
      </div>
      <div class="syncBadge">${syncBadgeText()}</div>
      ${fbEnabled && ROOM_CODE ? `<div class="roomBadge">কোড: <strong>${esc(ROOM_CODE)}</strong> · <button class="linkBtn" data-act="leaveRoom">পরিবর্তন</button></div>` : ""}
    </div>

    <div class="noticeBoard">
      <h2 class="boardTitle">📌 নোটিশ বোর্ড</h2>
      ${notices.length === 0 ? `<p class="empty boardEmpty">এখনো কোনো নোটিশ নেই।</p>` : `

function renderMemberView(memberId) {
  const member = DATA.members.find((m) => m.id === memberId);
  if (!member) {
    return `<div class="view">${headerHtml("সদস্য")}<p class="empty">এই সদস্যকে খুঁজে পাওয়া যায়নি।</p></div>`;
  }
  const entries = DATA.entries.filter((e) => e.memberId === memberId).sort((a, b) => (a.date < b.date ? 1 : -1));
  const total = entries.reduce((s, e) => s + Number(e.amount), 0);
  return `
  <div class="view">
    ${headerHtml(member.name)}
    <div class="stampBar"><div class="stamp small"><span class="stampInner">আপনার মোট জমা<strong>${taka(total)}</strong></span></div></div>
    <div class="panel">
      <h2 class="sectionLabel">লেনদেনের খতিয়ান</h2>
      ${entries.length === 0 ? `<p class="empty">এখনো কোনো চাঁদা জমা হয়নি।</p>` : ""}
      <div class="entryList">
        ${entries.map((e) => `
          <div class="entryRow">
            <div class="entryDate">📅 ${bnDate(e.date)}</div>
            <div class="entryMid">${e.note ? `<small>${esc(e.note)}</small>` : `<small>চাঁদা</small>`}</div>
            <div class="entryAmt">${taka(e.amount)}</div>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

  if (kind === "addMember") {
    html = modalShell("নতুন সদস্য", `

      <input class="fInput" id="m_name" placeholder="সদস্যের নাম" autofocus />

      <button class="primaryBtn" data-act="submitAddMember">✔️ যোগ করুন</button>
    `);
  } else if (kind && kind.type === "editMember") {
    const member = DATA.members.find((m) => m.id === kind.memberId);
    html = modalShell("সদস্যের তথ্য এডিট করুন", `
      <label class="fLabel">নাম</label>

      <label class="fLabel">নোট (ঐচ্ছিক)</label>
      <input class="fInput" id="e_note" placeholder="যেমন: মাসিক চাঁদা - বৈশাখ" />
      <button class="primaryBtn" data-act="submitAddEntryAll" style="background:#B8892B">✔️ সবার জন্য যোগ করুন</button>
    `);
  } else if (kind === "addNotice") {
    html = modalShell("নতুন নোটিশ", `
      <label class="fLabel">শিরোনাম (ঐচ্ছিক)</label>
      <input class="fInput" id="n_title" placeholder="যেমন: মাসিক সভা" autofocus />
      <label class="fLabel">নোটিশের বিবরণ</label>
      <textarea class="fInput fTextarea" id="n_text" rows="4" placeholder="নোটিশের লেখা এখানে লিখুন…"></textarea>
      <button class="primaryBtn" data-act="submitAddNotice">✔️ প্রকাশ করুন</button>
    `);
  } else if (kind === "addWa") {
    html = modalShell("নতুন হোয়াটসঅ্যাপ নাম্বার", `
      <label class="fLabel">নাম</label>
      <input class="fInput" id="w_name" placeholder="যেমন: সভাপতি — করিম সাহেব" autofocus />
      <label class="fLabel">হোয়াটসঅ্যাপ নাম্বার</label>
      <input class="fInput" id="w_number" placeholder="01xxxxxxxxx" />
      <button class="primaryBtn" data-act="submitAddWa">✔️ যোগ করুন</button>
    `);
  } else if (kind === "setup" || kind === "enter" || kind === "change") {
    const titles = { setup: "কমিটির জন্য PIN তৈরি করুন", enter: "PIN দিন", change: "নতুন PIN সেট করুন" };
    const needConfirm = kind === "setup" || kind === "change";
    html = modalShell(titles[kind], `
      ${kind === "setup" ? `<p class="modalHint">এই PIN যাদের কাছে থাকবে শুধু তারাই সদস্য যোগ ও চাঁদার হিসাব এডিট করতে পারবে। PIN মনে রাখুন — হারিয়ে গেলে পুনরুদ্ধার করা যাবে না।</p>` : ""}
      <label class="fLabel">PIN ${needConfirm ? "(অন্তত ৪ সংখ্যা)" : ""}</label>
      <input class="fInput" id="pin1" type="password" inputmode="numeric" placeholder="••••" autofocus />
      ${needConfirm ? `<label class="fLabel">PIN আবার দিন</label><input class="fInput" id="pin2" type="password" inputmode="numeric" placeholder="••••" />` : ""}
      <p class="fErr" id="pinErr" style="display:none"></p>
      <button class="primaryBtn" data-act="submitPin" data-mode="${kind}">🔒 নিশ্চিত করুন</button>
    `);
  } else if (kind === "roomGate") {
    html = `
    <div class="modalOverlay">
      <div class="modalCard" data-act="noop">
        <div class="modalTop"><h3>সমিতির সিঙ্ক কোড</h3></div>
        <p class="modalHint">যে কোডটি দেবেন, সেই একই কোড সব সদস্যের ফোনে দিলে সবাই একসাথে রিয়েল-টাইমে একই হিসাব দেখতে পাবেন। নতুন সমিতি হলে একটা কোড তৈরি করুন, আগে থেকে থাকলে সেটা লিখে যোগ দিন।</p>
        <label class="fLabel">কোড লিখে যোগ দিন</label>
        <input class="fInput" id="room_code" placeholder="যেমন: AB12CD" style="text-transform:uppercase" />
        <button class="primaryBtn" data-act="submitJoinRoom">যোগ দিন</button>
        <div class="divider"><span>অথবা</span></div>
        <button class="primaryBtn" data-act="submitNewRoom" style="background:#B8892B">🆕 নতুন কোড তৈরি করুন</button>
        <button class="linkBtn" style="display:block;margin:16px auto 0" data-act="skipSync">সিঙ্ক ছাড়া শুধু এই ডিভাইসে ব্যবহার করুন</button>
      </div>
    </div>`;
  }

  container.innerHTML = html;
  document.body.appendChild(container);
}

function closeModalRoot() {
  document.querySelectorAll("#modalRoot").forEach((el) => el.remove());
}

/* ---------- event binding ---------- */
function bindEvents() {
  document.body.addEventListener("click", handleClick, { once: false });
  const search = document.getElementById("searchInput");
  if (search) {
    search.addEventListener("input", (e) => { UI.query = e.target.value; render(); });
    const len = search.value.length;
    search.focus();
    search.setSelectionRange(len, len);
  }
}

document.body.addEventListener("click", handleClick);

function handleClick(e) {
  try { handleClickInner(e); }
  catch (err) { console.error("somiti-khata click error:", err); }
}

function handleClickInner(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;

  if (act === "goHome") { UI.role = null; UI.tab = "members"; render(); }
  else if (act === "openAdmin") { openPinGate(DATA.adminPinHash ? "enter" : "setup"); }
  else if (act === "viewAll") { UI.role = "viewAll"; UI.tab = "members"; render(); }
  else if (act === "openWhatsapp") { UI.role = "whatsapp"; render(); }
  else if (act === "openMember") { UI.role = { memberId: id }; render(); }
  else if (act === "print") { window.print(); }
  else if (act === "tab") { UI.tab = t.dataset.tab; render(); }
  else if (act === "changePin") { openPinGate("change"); }

  else if (act === "showAddMember") { UI.modal = "addMember"; render(); }
  else if (act === "removeMember") {
    const m = DATA.members.find((mm) => mm.id === id);
    const ok = confirm(`"${m ? m.name : "এই সদস্য"}" কে মুছে ফেলতে চান? তার সব চাঁদার হিসাবও মুছে যাবে। এটা ফিরিয়ে আনা যাবে না।`);
    if (!ok) return;
    DATA.members = DATA.members.filter((mm) => mm.id !== id);
    DATA.entries = DATA.entries.filter((en) => en.memberId !== id);
    saveData(); render();
  }
  else if (act === "showAddEntry") { UI.modal = { type: "addEntry", memberId: id }; render(); }
  else if (act === "submitAddEntry") {
    const amt = Number(document.getElementById("e_amount").value);
    const date = document.getElementById("e_date").value || todayISO();
    const note = document.getElementById("e_note").value.trim();
    if (!amt || amt <= 0) return;
    DATA.entries.push({ id: uid(), memberId: id, amount: amt, date, note });
    saveData(); UI.modal = null; render();
  }
  else if (act === "showAddEntryAll") { UI.modal = "addEntryAll"; render(); }
  else if (act === "submitAddEntryAll") {
    const amt = Number(document.getElementById("e_amount").value);
    const date = document.getElementById("e_date").value || todayISO();
    const note = document.getElementById("e_note").value.trim();
    if (!amt || amt <= 0) return;
    if (DATA.members.length === 0) return;
    const ok = confirm(`${bn(DATA.members.length)} জন সদস্যের প্রত্যেকের হিসাবে ${taka(amt)} করে যোগ হবে। নিশ্চিত?`);
    if (!ok) return;
    DATA.members.forEach((m) => {
      DATA.entries.push({ id: uid(), memberId: m.id, amount: amt, date, note });
    });
    saveData(); UI.modal = null; render();
  }
  else if (act === "showEditEntry") { UI.modal = { type: "editEntry", entryId: id }; render(); }
  else if (act === "submitEditEntry") {
    const amt = Number(document.getElementById("e_amount").value);
    const date = document.getElementById("e_date").value || todayISO();
    const note = document.getElementById("e_note").value.trim();
    if (!amt || amt <= 0) return;
    DATA.entries = DATA.entries.map((en) => en.id === id ? { ...en, amount: amt, date, note } : en);
    saveData(); UI.modal = null; render();
  }
  else if (act === "removeEntry") {
    const ok = confirm("এই চাঁদার এন্ট্রিটা মুছে ফেলতে চান? এটা ফিরিয়ে আনা যাবে না।");
    if (!ok) return;
    DATA.entries = DATA.entries.filter((en) => en.id !== id);
    saveData(); render();
  }
  else if (act === "submitAddMember") {
    const name = document.getElementById("m_name").value.trim();
    const phone = document.getElementById("m_phone").value.trim();
    if (!name) return;
    DATA.members.push({ id: uid(), name, phone, joined: todayISO() });
    saveData(); UI.modal = null; render();
  }
  else if (act === "showEditMember") { UI.modal = { type: "editMember", memberId: id }; render(); }
  else if (act === "submitEditMember") {
    const name = document.getElementById("m_name").value.trim();
    const phone = document.getElementById("m_phone").value.trim();
    if (!name) return;
    DATA.members = DATA.members.map((m) => m.id === id ? { ...m, name, phone } : m);
    saveData(); UI.modal = null; render();
  }

  else if (act === "showAddNotice") { UI.modal = "addNotice"; render(); }
  else if (act === "submitAddNotice") {
    const title = document.getElementById("n_title").value.trim();
    const text = document.getElementById("n_text").value.trim();
    if (!text) return;
    DATA.notices.push({ id: uid(), title, text, date: todayISO() });
    saveData(); UI.modal = null; render();
  }
  else if (act === "removeNotice") {
    const ok = confirm("এই নোটিশটা মুছে ফেলতে চান?");
    if (!ok) return;
    DATA.notices = DATA.notices.filter((n) => n.id !== id); saveData(); render();
  }

  else if (act === "showAddWa") { UI.modal = "addWa"; render(); }
  else if (act === "submitAddWa") {
    const name = document.getElementById("w_name").value.trim();
    const number = document.getElementById("w_number").value.trim();
    if (!name || !number) return;
    DATA.whatsapp.push({ id: uid(), name, number });
    saveData(); UI.modal = null; render();
  }
  else if (act === "removeWa") {
    const w = DATA.whatsapp.find((ww) => ww.id === id);
    const ok = confirm(`"${w ? w.name : "এই নাম্বার"}" মুছে ফেলতে চান?`);
    if (!ok) return;
    DATA.whatsapp = DATA.whatsapp.filter((ww) => ww.id !== id); saveData(); render();
  }

  else if (act === "closeModal") { UI.modal = null; render(); }
  else if (act === "submitPin") { submitPin(t.dataset.mode); }
  else if (act === "submitJoinRoom") {
    const code = document.getElementById("room_code").value.trim();
    if (!code) return;
    setRoomCode(code);
  }
  else if (act === "submitNewRoom") { setRoomCode(genRoomCode()); }
  else if (act === "skipSync") {
    safeLS.set("somiti-skip-sync", "1");
    fbEnabled = false;
    SYNC_STATUS = "local";
    DATA = loadLocal();
    UI.modal = null;
    render();
  }
  else if (act === "leaveRoom") {
    const ok = confirm("সিঙ্ক কোড পরিবর্তন করতে চান? এখনকার হিসাব থেকে বেরিয়ে যাবেন (ডাটা মুছবে না, শুধু আলাদা কোডে ঢুকতে পারবেন)।");
    if (!ok) return;
    leaveRoom();
  }
}

function openPinGate(mode) { UI.modal = mode; render(); }

async function submitPin(mode) {
  const pin1 = document.getElementById("pin1").value;
  const errEl = document.getElementById("pinErr");
  const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = "block"; };

  if (pin1.trim().length < 4) { showErr("অন্তত ৪ সংখ্যার PIN দিন।"); return; }

  if (mode === "setup" || mode === "change") {
    const pin2 = document.getElementById("pin2").value;
    if (pin1 !== pin2) { showErr("দুটি PIN মিলছে না।"); return; }
    const h = await hashPin(pin1);
    DATA.adminPinHash = h;
    saveData();
    UI.modal = null;
    if (mode === "setup") UI.role = "admin";
    render();
  } else {
    const h = await hashPin(pin1);
    if (h === DATA.adminPinHash) {
      UI.modal = null; UI.role = "admin"; UI.tab = "members"; render();
    } else {
      showErr("ভুল PIN। আবার চেষ্টা করুন।");
      document.getElementById("pin1").value = "";
    }
  }
}

/* ---------- boot ---------- */
if (safeLS.get("somiti-skip-sync") === "1") {
  fbEnabled = false;
  SYNC_STATUS = "local";
}
startSync();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
